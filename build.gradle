plugins {
    id 'java'
    id 'application'
}

group = 'io.github.adipassover'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {

    // BoofCV
    implementation 'org.boofcv:boofcv-core:0.44'       // Core

    // Lombok
    compileOnly 'org.projectlombok:lombok:1.18.34'
    annotationProcessor 'org.projectlombok:lombok:1.18.34'
    testCompileOnly 'org.projectlombok:lombok:1.18.34'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.34'

    // JSR-305
    implementation 'com.google.code.findbugs:jsr305:3.0.2'

    // Jackson (run-record manifest and dataset-descriptor serialisation)
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'

    // Testing
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'

}

application {
    mainClass = project.hasProperty('mainClass') ? project.getProperty('mainClass') : 'org.boofcv.evaluation.VoRunnerApp'
}

test {
    useJUnitPlatform()
}
